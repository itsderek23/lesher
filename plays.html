<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Playbook - 🏀 Lesher Boys Basketball</title>
  <meta name="description" content="Lesher Middle School Boys Basketball playbook" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    html { scroll-behavior: smooth; }
    main h2, .play-card { scroll-margin-top: 1rem; }
    .toc { columns: 2; column-gap: 2rem; margin: 0 0 2rem; }
    .toc section { break-inside: avoid; margin-bottom: 1rem; }
    .toc h3 { margin: 0; padding-bottom: .3rem; border-bottom: 2px solid #e60000; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
    .toc a { color: #002147; text-decoration: none; }
    .toc ul { list-style: none; padding: 0; margin: 0; }
    .toc li a { display: flex; justify-content: space-between; padding: .55rem .25rem; border-bottom: 1px solid #e6e8ec; font-weight: 500; }
    .toc li a::after { content: "›"; color: #6b7280; font-size: 1.2rem; line-height: 1; }
    @media (max-width: 600px) {
      .toc { columns: 1; }
    }
    .unlock { max-width: 420px; margin: 0 0 2rem; }
    .unlock label { display: block; margin-bottom: .5rem; }
    .unlock-row { display: flex; gap: .5rem; }
    .unlock input { flex: 1; min-width: 0; font: inherit; padding: .5rem .75rem; border: 1px solid #ccc; border-radius: .5rem; }
    .unlock button { font: inherit; padding: .5rem 1rem; border: 0; border-radius: .5rem; background: #002147; color: #fff; cursor: pointer; }
    .unlock-error { color: #e60000; margin: .5rem 0 0; }
    .back-to-top {
      position: fixed; right: 1rem; bottom: 1rem; z-index: 1000; padding: .5rem .9rem; border-radius: 999px;
      background: #002147; color: #fff; text-decoration: none; box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .back-to-top.show { opacity: 1; pointer-events: auto; }
    .play-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.5rem; margin-bottom: 3rem; }
    @media (max-width: 800px) { .play-grid { grid-template-columns: 1fr; } }
    .play-card { min-width: 0; }
    .play-card h2 { margin: 0; font-size: 1.25rem; }
    /* Section headings read as dividers so they stand apart from play titles. */
    #plays > h2 {
      margin: 0 0 1.25rem; padding-bottom: .4rem; border-bottom: 3px solid #e60000;
      font-size: 1rem; text-transform: uppercase; letter-spacing: .08em; color: #002147;
    }
    .play-meta { margin: 0 0 .5rem; color: #666; font-size: .95rem; }
    .play-desc { margin: 0 0 1rem; }
    .play-card svg { display: block; width: 100%; height: auto; border-radius: .75rem; border: 1px solid #ddd; background: #eef1f5; }
    .play-card:not(.fullscreen) svg { cursor: zoom-in; }
    .play-card.selected:not(.fullscreen) svg { border-color: #002147; box-shadow: 0 0 0 2px #002147; }

    .play-card.fullscreen {
      position: fixed; inset: 0; z-index: 2000; display: flex; flex-direction: column;
      padding: 1rem; background: #fff; overflow: auto;
    }
    .play-card.fullscreen > * { flex-shrink: 0; }
    .play-card.fullscreen svg { flex: 1 1 auto; flex-shrink: 1; min-height: 0; height: 100%; border: 0; }
    .play-card.fullscreen .play-meta,
    .play-card.fullscreen .play-desc { display: none; }
    .play-card.fullscreen .play-caption { min-height: 2.4em; font-size: 1.15rem; }
    .play-full { margin-left: auto; }
    .play-card.static .play-controls > :not(.play-full), .play-card.static .play-scrub { display: none; }
    .play-variants { display: flex; flex-wrap: wrap; gap: .4rem; margin: 0 0 .75rem; }
    .play-variants button {
      font: inherit; font-size: .9rem; padding: .3rem .8rem; border: 1px solid #ccc; border-radius: 999px;
      background: #fff; color: #444; cursor: pointer;
    }
    .play-variants button.active { background: #002147; border-color: #002147; color: #fff; }

    .court .oob { fill: #eef1f5; }
    .court .floor { fill: #f6ead7; }
    .court .paint { fill: #e9d6b6; stroke: #333; stroke-width: 2.5; }
    .court .line { fill: none; stroke: #333; stroke-width: 2.5; }
    .court .dashed { stroke-dasharray: 8 7; }
    .court .boundary { stroke-width: 4; }
    .court .backboard { stroke: #333; stroke-width: 5; }
    .court .rim { fill: none; stroke: #e60000; stroke-width: 3; }
    .court-label { font: 600 16px system-ui, sans-serif; fill: #8a94a3; text-anchor: middle; letter-spacing: 2px; }

    .trail { fill: none; stroke: #002147; stroke-width: 3.5; stroke-linecap: round; }
    .trail.screen { stroke: #e60000; }
    .trail.pass { stroke: #555; stroke-dasharray: 9 7; stroke-width: 3; }
    .vacated { fill: none; stroke: #e60000; stroke-width: 3; stroke-dasharray: 6 5; animation: vacated-pulse .5s ease-in-out infinite alternate; }
    @keyframes vacated-pulse { from { opacity: .2; } to { opacity: 1; } }
    .trail.handoff { stroke: #002147; stroke-dasharray: 6 4; stroke-width: 2.5; }
    .trail-end path { fill: #002147; }
    .trail-end line { stroke: #e60000; stroke-width: 5; stroke-linecap: round; }
    .step-trail { transition: opacity .3s; }
    .step-trail.past { opacity: .3; }

    .player circle { fill: #002147; stroke: #fff; stroke-width: 3; }
    .player text { fill: #fff; font: 700 15px system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    .ball { fill: #f08a24; stroke: #7a3d06; stroke-width: 2; }
    .trail.shift, .trail-end.shift { display: none; }
    .player.defense circle { fill: #fff; stroke: #e60000; stroke-width: 3; }
    .player.defense text { fill: #e60000; }
    .player.defense .call { font-size: 13px; letter-spacing: .5px; fill: #002147; paint-order: stroke; stroke: #f6ead7; stroke-width: 4px; }
    .low-star { fill: #f2b705; stroke: #a87d00; stroke-width: 1.5; }
    .guard { stroke: #e60000; stroke-width: 1.5; stroke-dasharray: 4 4; opacity: .7; }

    .play-caption { min-height: 3.2em; margin: .75rem 0 .5rem; font-weight: 600; }
    .play-controls { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    .play-controls button {
      font: inherit; padding: .4rem .75rem; border: 1px solid #ccc; border-radius: .5rem; background: #fff; cursor: pointer;
    }
    .play-controls button.primary { background: #002147; border-color: #002147; color: #fff; min-width: 6.5rem; }
    .play-scrub { width: 100%; margin: .75rem 0 0; accent-color: #002147; }
    .position-key { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; padding: 0; margin: 0 0 2rem; list-style: none; }
    .position-key[hidden] { display: none; }
    .position-key b.defender { background: #fff; color: #e60000; border: 3px solid #e60000; box-sizing: border-box; }
    .position-key b.star { background: none; color: #f2b705; font-size: 1.6rem; }
    .position-key li { display: flex; align-items: center; gap: .5rem; }
    .position-key b { display: inline-grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; background: #002147; color: #fff; font-size: .8rem; }
    @media (max-width: 480px) {
      .play-controls { flex-wrap: nowrap; gap: .4rem; }
      .play-controls button { padding: .4rem .6rem; }
      .play-controls button.primary { min-width: 5.5rem; }
      .play-full .label { display: none; }
    }
    @media (max-width: 360px) {
      .play-controls button { padding: .35rem .45rem; font-size: .9rem; white-space: nowrap; }
      .play-controls button.primary { min-width: 4.75rem; }
    }
  </style>
</head>
<body>
  <header class="site">
    <nav class="nav">
      <div class="brand"><a href="index.html">🏀 Lesher Boys Basketball</a></div>
      <button class="menu">☰</button>
      <div class="links">
        <a href="index.html">Home</a>
        <a href="https://band.us/n/a0a8bak2ydDa9" target="_blank">
          <img src="band_logo.png" class="band_logo">Band App
        </a>
        <a href="school-season.html">Season Info</a>
        <a href="sunday_open_gyms.html">Open Gyms</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="wrap">
      <h1 id="top">Playbook</h1>

      <ul class="position-key" hidden>
        <li><b>PG</b> Point guard</li>
        <li><b>H</b> Horn</li>
        <li><b>C</b> Corner</li>
        <li><b class="defender">X</b> Defender</li>
        <li><b class="star">★</b> Low man helper</li>
      </ul>

      <nav class="toc" aria-label="Playbook" hidden></nav>

      <form class="unlock" hidden>
        <label for="team-password">Enter the team password to see the playbook.</label>
        <div class="unlock-row">
          <input id="team-password" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required>
          <button type="submit">Unlock</button>
        </div>
        <p class="unlock-error" hidden>Incorrect password.</p>
      </form>

      <div id="plays"></div>
    </section>
  </main>

  <a href="#top" class="back-to-top">↑ Top</a>

  <footer class="wrap foot">
    Join our <img src="band_logo.png" class="band_logo"><a href="https://band.us/n/a0a8bak2ydDa9" target="_blank">Band App</a> for updates.
  </footer>

  <script src="play-animator.js"></script>
  <script src="unlock.js"></script>
  <script src="plays.enc.js"></script>
  <script>
    document.querySelector('.menu').addEventListener('click', () => {
      document.body.classList.toggle('open');
    });

    function buildToc() {
      // Table of contents: a heading per section, then one row per play in that section.
      const toc = document.querySelector('.toc');
      for (const heading of document.querySelectorAll('#plays > h2')) {
        const section = document.createElement('section');
        const title = section.appendChild(document.createElement('h3'));
        const sectionLink = title.appendChild(document.createElement('a'));
        sectionLink.href = `#${heading.id}`;
        sectionLink.textContent = heading.textContent;
        const list = section.appendChild(document.createElement('ul'));
        for (const card of heading.nextElementSibling.querySelectorAll('.play-card')) {
          // A play named the same as its section (e.g. Press Break) is listed by its tab names instead.
          let name = card.querySelector('h2').textContent;
          const tabs = [...card.querySelectorAll('.play-variants button')].map((b) => b.textContent);
          if (name === heading.textContent && tabs.length) name = tabs.join(' / ');
          const link = list.appendChild(document.createElement('li')).appendChild(document.createElement('a'));
          link.href = `#${card.id}`;
          link.textContent = name;
        }
        toc.appendChild(section);
      }
      toc.hidden = false;
    }

    const backToTop = document.querySelector('.back-to-top');
    const updateBackToTop = () => backToTop.classList.toggle('show', window.scrollY > 400);
    window.addEventListener('scroll', updateBackToTop, { passive: true });
    updateBackToTop();

    // The plays are encrypted with the team password; the same login unlocks the stats page.
    unlockPage(window.PLAYS_ENCRYPTED, ({ html, script }) => {
      document.getElementById('plays').innerHTML = html;
      new Function(script)();
      buildToc();
      document.querySelector('.position-key').hidden = false;
    });
  </script>
</body>
</html>
