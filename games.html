<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon-32x32.png">
<title>Game Stats</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #111; background: #fff; overflow-x: hidden; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
h1 { margin: 0 0 .25rem; color: #002147; }
.sub { color: #555; margin: 0 0 1.5rem; }
.tabs { display: flex; gap: .5rem; margin: 0 0 1.5rem; }
.tabs button { font: inherit; font-weight: 600; padding: .4rem 1.1rem; border-radius: 999px; border: 2px solid #002147; background: #fff; color: #002147; cursor: pointer; }
.tabs button[aria-selected="true"] { background: #002147; color: #fff; }
h2 { margin: 2rem 0 .75rem; padding-bottom: .4rem; border-bottom: 3px solid #e60000; font-size: 1rem; text-transform: uppercase; letter-spacing: .08em; color: #002147; }
.record { display: flex; flex-wrap: wrap; gap: 1rem 2rem; margin: 0 0 .5rem; }
.record div { border-top: 3px solid #002147; padding-top: .35rem; min-width: 7rem; }
.record b { display: block; font-size: 1.5rem; color: #002147; }
.record span { color: #555; font-size: .85rem; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: .4rem .6rem; text-align: right; border-bottom: 1px solid #e3e3e3; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: #fff; }
thead th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: #555; border-bottom: 2px solid #002147; }
tbody tr:hover td { background: #f4f6f9; }
tfoot td { font-weight: 700; border-bottom: 0; }
tfoot tr:first-child td { border-top: 2px solid #002147; }
tfoot tr + tr td { color: #555; font-weight: 600; }
td.dim { color: #aaa; }
.game { margin: 0 0 1.75rem; }
.game h3 { margin: 0 0 .1rem; font-size: 1.05rem; color: #002147; }
.game h3 .res { display: inline-block; min-width: 1.4rem; margin-right: .35rem; color: #fff; background: #1b7a3a; border-radius: .3rem; text-align: center; font-size: .85rem; padding: 0 .3rem; }
.game h3 .res.L { background: #e60000; }
.game .meta { margin: 0 0 .5rem; color: #666; font-size: .9rem; }
thead th { cursor: pointer; user-select: none; }
thead th:hover { color: #002147; }
thead th[aria-sort]::after { content: ' ▼'; font-size: .7em; }
thead th[aria-sort="ascending"]::after { content: ' ▲'; }
.note { color: #666; font-size: .85rem; margin: .5rem 0 0; }
</style>
</head>
<body>
<main class="wrap">
  <h1>Game Stats</h1>
  <p class="sub">Lesher Boys Basketball, 2026–27. Taken from the scorebook.</p>
  <div class="tabs" role="tablist">
    <button role="tab" data-team="V" aria-selected="true">Varsity</button>
    <button role="tab" data-team="JV" aria-selected="false">JV</button>
  </div>
  <div id="out"></div>
</main>
<script>
  // Add a game to the top of the list. Each player listed played in the game.
  // Per player: pts, reb (rebounds), ast (assists), stl (steals), pf (personal fouls). Leave a stat off when it wasn't tracked.
  // `oppStats` holds the other team's rebound/steal/foul totals, `to` is our team turnovers, and `unassigned` is
  // points in the final score that the scorebook didn't give to anyone. `ft` is [made, attempted] free throws from
  // the scorebook, and `ftPartial` marks a game whose scorebook likely missed some free throws.
  const games = [
    {
      date: '2026-11-13', team: 'V', opp: 'Lincoln', us: 47, them: 28, oppStats: { pf: 9 },
      players: {
        'Bodhi Hottman': { pts: 15, pf: 2, ft: [1, 1] },
        'Ryder Rozell': { pts: 11, pf: 0, ft: [0, 1] },
        'Carter Dowling': { pts: 10, pf: 2, ft: [0, 0] },
        'August Parks': { pts: 4, pf: 0, ft: [0, 0] },
        'Max Blanchard': { pts: 2, pf: 2, ft: [0, 0] },
        'Patrick Parker-Renga': { pts: 2, pf: 0, ft: [0, 0] },
        'Judah Harris': { pts: 3, pf: 3, ft: [1, 1] },
        'Asher Beauprez': { pts: 1, pf: 3, ft: [1, 1] },
      },
    },
    {
      date: '2026-11-13', team: 'JV', opp: 'Lincoln', us: 45, them: 7, unassigned: 3, oppStats: { pf: 5 },
      players: {
        'Thomas Langusch': { pts: 12, pf: 3, ft: [0, 0] },
        'Patrick Parker-Renga': { pts: 7, pf: 1, ft: [1, 1] },
        'Cole Haynes': { pts: 6, pf: 1, ft: [0, 0] },
        'Harry Hoban': { pts: 5, pf: 1, ft: [1, 1] },
        'Hunter Steele-Wannemacher': { pts: 5, pf: 1, ft: [1, 1] },
        'August Parks': { pts: 4, pf: 0, ft: [0, 0] },
        'Max Riojas': { pts: 3, pf: 1, ft: [1, 1] },
        'Miles Patton': { pts: 0, pf: 0, ft: [0, 1] },
      },
    },
    {
      date: '2026-11-11', team: 'V', opp: 'Blevins', us: 52, them: 36, to: 12, oppStats: { reb: 18, pf: 18 },
      players: {
        'Carter Dowling': { pts: 17, reb: 3, ast: 1, stl: 3, pf: 3, ft: [1, 1] },
        'Bodhi Hottman': { pts: 12, reb: 0, ast: 2, stl: 1, pf: 1, ft: [2, 2] },
        'Judah Harris': { pts: 10, reb: 4, ast: 1, stl: 0, pf: 2, ft: [2, 3] },
        'Max Blanchard': { pts: 4, reb: 4, ast: 0, stl: 0, pf: 2, ft: [1, 1] },
        'Ryder Rozell': { pts: 4, reb: 3, ast: 0, stl: 0, pf: 2, ft: [0, 0] },
        'August Parks': { pts: 1, reb: 4, ast: 0, stl: 0, pf: 0, ft: [1, 2] },
        'Asher Beauprez': { pts: 1, reb: 1, ast: 4, stl: 0, pf: 3, ft: [1, 1] },
        'Patrick Parker-Renga': { pts: 1, reb: 1, ast: 1, stl: 0, pf: 0, ft: [1, 1] },
      },
    },
    {
      date: '2026-11-11', team: 'JV', opp: 'Blevins', us: 60, them: 33, to: 11, oppStats: { reb: 24, pf: 7 },
      players: {
        'Hunter Steele-Wannemacher': { pts: 11, reb: 6, ast: 2, stl: 1, pf: 2, ft: [1, 1] },
        'Thomas Langusch': { pts: 11, reb: 1, ast: 4, stl: 2, pf: 3, ft: [0, 0] },
        'William Garrett': { pts: 9, reb: 7, ast: 0, stl: 1, pf: 2, ft: [0, 0] },
        'Max Riojas': { pts: 8, reb: 9, ast: 0, stl: 1, pf: 3, ft: [0, 0] },
        'Patrick Parker-Renga': { pts: 8, reb: 3, ast: 2, stl: 2, pf: 2, ft: [0, 0] },
        'Cole Haynes': { pts: 7, reb: 4, ast: 2, stl: 3, pf: 3, ft: [0, 1] },
        'Harry Hoban': { pts: 4, reb: 7, ast: 0, stl: 2, pf: 0, ft: [0, 0] },
        'Miles Patton': { pts: 2, reb: 0, ast: 1, stl: 1, pf: 2, ft: [0, 0] },
      },
    },
    {
      date: '2026-11-09', team: 'V', opp: 'Webber', us: 44, them: 39, to: 10, oppStats: { reb: 23, pf: 11 },
      players: {
        'Ryder Rozell': { pts: 15, reb: 4, stl: 4, pf: 1, ft: [0, 0] },
        'Bodhi Hottman': { pts: 12, reb: 1, stl: 1, pf: 1, ft: [0, 0] },
        'Carter Dowling': { pts: 9, reb: 0, stl: 4, pf: 0, ft: [2, 3] },
        'Asher Beauprez': { pts: 4, reb: 1, stl: 2, pf: 1, ft: [1, 2] },
        'Max Blanchard': { pts: 3, reb: 1, stl: 2, pf: 1, ft: [1, 2] },
        'Judah Harris': { pts: 1, reb: 1, stl: 0, pf: 2, ft: [1, 2] },
        'August Parks': { pts: 0, reb: 3, stl: 2, pf: 2, ft: [0, 0] },
      },
    },
    {
      date: '2026-11-09', team: 'JV', opp: 'Webber', us: 50, them: 48, ot: true, to: 11, oppStats: { reb: 27, pf: 16 },
      players: {
        'Thomas Langusch': { pts: 20, reb: 0, stl: 0, pf: 3, ft: [4, 4] },
        'Patrick Parker-Renga': { pts: 12, reb: 5, stl: 5, pf: 1, ft: [3, 4] },
        'Hunter Steele-Wannemacher': { pts: 8, reb: 3, stl: 0, pf: 4, ft: [1, 1] },
        'William Garrett': { pts: 5, reb: 1, stl: 1, pf: 3, ft: [0, 3] },
        'Max Riojas': { pts: 3, reb: 2, stl: 0, pf: 0, ft: [1, 2] },
        'Miles Patton': { pts: 2, reb: 2, stl: 1, pf: 3, ft: [0, 0] },
        'Cole Haynes': { pts: 0, reb: 0, stl: 1, pf: 4, ft: [0, 0] },
      },
    },
    {
      date: '2026-11-04', team: 'V', opp: 'Boltz', us: 53, them: 32, ftPartial: true, oppStats: { reb: 24, stl: 4, pf: 11 },
      players: {
        'Bodhi Hottman': { pts: 17, reb: 4, stl: 3, pf: 1, ft: [0, 0] },
        'Carter Dowling': { pts: 12, reb: 6, stl: 3, pf: 2, ft: [1, 1] },
        'Connor Thorson': { pts: 6, reb: 2, stl: 2, pf: 3, ft: [0, 0] },
        'Judah Harris': { pts: 6, reb: 3, stl: 1, pf: 1, ft: [1, 1] },
        'Max Blanchard': { pts: 6, reb: 2, stl: 1, pf: 2, ft: [1, 1] },
        'Ryder Rozell': { pts: 4, reb: 3, stl: 6, pf: 2, ft: [0, 2] },
        'Stewart Rapley': { pts: 2, reb: 6, stl: 1, pf: 0, ft: [0, 0] },
        'Asher Beauprez': { pts: 0, reb: 1, stl: 1, pf: 1, ft: [0, 0] },
      },
    },
    {
      date: '2026-11-04', team: 'JV', opp: 'Boltz', us: 49, them: 14, ftPartial: true, oppStats: { reb: 15, stl: 0, pf: 8 },
      players: {
        'Thomas Langusch': { pts: 12, reb: 1, pf: 1, ft: [0, 0] },
        'William Garrett': { pts: 10, reb: 4, pf: 2, ft: [0, 0] },
        'Cole Haynes': { pts: 9, reb: 0, pf: 1, ft: [2, 3] },
        'Hunter Steele-Wannemacher': { pts: 5, reb: 5, pf: 0, ft: [0, 0] },
        'August Parks': { pts: 4, reb: 6, pf: 0, ft: [0, 0] },
        'Patrick Parker-Renga': { pts: 4, reb: 2, pf: 2, ft: [0, 1] },
        'Max Riojas': { pts: 3, reb: 0, pf: 0, ft: [1, 1] },
        'Miles Patton': { pts: 2, reb: 0, pf: 1, ft: [0, 0] },
      },
    },
  ];

  // Stats besides points, shown only when at least one game in view tracked them.
  const STATS = [
    ['reb', 'REB', 'RPG'],
    ['ast', 'AST', 'APG'],
    ['stl', 'STL', 'SPG'],
    ['pf', 'PF', 'PF/G'],
  ];
  const avg = (n, gp) => (gp ? (n / gp).toFixed(1) : '–');
  const fmtDate = (d) => new Date(d + 'T12:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const sum = (arr, f) => arr.reduce((n, x) => n + f(x), 0);
  const tracked = (players, key) => players.some((s) => s[key] != null);
  const pct = (m, a) => (a ? Math.round((100 * m) / a) + '%' : '–');
  const ftCell = (ft) => (ft ? `${ft[0]}–${ft[1]}` : '–');

  function render(team) {
    const list = games.filter((g) => g.team === team);
    const wins = list.filter((g) => g.us > g.them).length;
    const toGames = list.filter((g) => g.to != null);
    const allPlayers = list.flatMap((g) => Object.values(g.players));
    const stats = STATS.filter(([key]) => tracked(allPlayers, key));
    const hasFt = tracked(allPlayers, 'ft');

    const totals = {};
    for (const g of list) {
      for (const [name, s] of Object.entries(g.players)) {
        const t = (totals[name] ||= { gp: 0, pts: 0 });
        t.gp += 1;
        t.pts += s.pts;
        if (s.ft) {
          t.ftm = (t.ftm || 0) + s.ft[0];
          t.fta = (t.fta || 0) + s.ft[1];
        }
        for (const [key] of stats) {
          if (s[key] == null) continue;
          t[key] = (t[key] || 0) + s[key];
          t[key + 'Gp'] = (t[key + 'Gp'] || 0) + 1;
        }
      }
    }
    const rows = Object.entries(totals).sort((a, b) => b[1].pts / b[1].gp - a[1].pts / a[1].gp || a[0].localeCompare(b[0]));

    let html = `
      <div class="record">
        <div><b>${wins}–${list.length - wins}</b><span>Record</span></div>
        <div><b>${avg(sum(list, (g) => g.us), list.length)}</b><span>Points per game</span></div>
        <div><b>${avg(sum(list, (g) => g.them), list.length)}</b><span>Allowed per game</span></div>
        ${toGames.length ? `<div><b>${avg(sum(toGames, (g) => g.to), toGames.length)}</b><span>Turnovers per game</span></div>` : ''}
      </div>
      <h2>Season totals &amp; averages</h2>
      <div class="scroll"><table>
        <thead><tr><th>Player</th><th>GP</th><th>PTS</th><th>PPG</th>${stats.map(([, tot, per]) => `<th>${tot}</th><th>${per}</th>`).join('')}${hasFt ? '<th>FT</th><th>FT%</th>' : ''}</tr></thead>
        <tbody>${rows
          .map(
            ([name, t]) => `<tr><td>${esc(name)}</td><td>${t.gp}</td><td>${t.pts}</td><td>${avg(t.pts, t.gp)}</td>${stats
              .map(([key]) => `<td>${t[key + 'Gp'] ? t[key] : '–'}</td><td>${avg(t[key], t[key + 'Gp'])}</td>`)
              .join('')}${hasFt ? `<td>${t.fta != null ? `${t.ftm}–${t.fta}` : '–'}</td><td>${pct(t.ftm, t.fta)}</td>` : ''}</tr>`
          )
          .join('')}</tbody>
      </table></div>
      <p class="note">Each average only counts games where that stat was tracked. Free throws come from the scorebook${list.some((g) => g.ftPartial) ? ', which likely missed some at Boltz' : ''}.</p>
      <h2>Games</h2>`;

    for (const g of list) {
      const ps = Object.values(g.players);
      const players = Object.entries(g.players).sort((a, b) => b[1].pts - a[1].pts || a[0].localeCompare(b[0]));
      const res = g.us > g.them ? 'W' : 'L';
      const extra = [
        g.ot && 'Overtime',
        g.to != null && `${g.to} turnovers`,
        g.unassigned && `${g.unassigned} pts not credited to a player in the scorebook`,
        g.ftPartial && 'Free throws may be incomplete',
      ].filter(Boolean).join(' · ');
      const cols = STATS.filter(([key]) => tracked(ps, key));
      const gameFt = tracked(ps, 'ft');
      const ftm = sum(ps, (p) => p.ft?.[0] || 0);
      const fta = sum(ps, (p) => p.ft?.[1] || 0);
      const foot = `<tfoot><tr><td>Lesher</td><td>${g.us}</td>${cols.map(([key]) => `<td>${sum(ps, (s) => s[key] || 0)}</td>`).join('')}${gameFt ? `<td>${ftm}–${fta} (${pct(ftm, fta)})</td>` : ''}</tr>
          <tr><td>${esc(g.opp)}</td><td>${g.them}</td>${cols.map(([key]) => `<td>${g.oppStats?.[key] ?? '–'}</td>`).join('')}${gameFt ? '<td>–</td>' : ''}</tr></tfoot>`;
      html += `
        <div class="game">
          <h3><span class="res ${res}">${res}</span>vs ${esc(g.opp)}, ${g.us}–${g.them}</h3>
          <p class="meta">${fmtDate(g.date)}${extra ? ' · ' + extra : ''}</p>
          <div class="scroll"><table>
            <thead><tr><th>Player</th><th>PTS</th>${cols.map(([, label]) => `<th>${label}</th>`).join('')}${gameFt ? '<th>FT</th>' : ''}</tr></thead>
            <tbody>${players
              .map(([name, s]) => `<tr><td>${esc(name)}</td><td${s.pts ? '' : ' class="dim"'}>${s.pts}</td>${cols.map(([key]) => `<td>${s[key] ?? '–'}</td>`).join('')}${gameFt ? `<td${s.ft?.[1] ? '' : ' class="dim"'}>${ftCell(s.ft)}</td>` : ''}</tr>`)
              .join('')}</tbody>
            ${foot}
          </table></div>
        </div>`;
    }
    document.getElementById('out').innerHTML = html;
  }

  // Click a column header to sort that table; click again to flip the order. Numbers sort high-to-low
  // first, names A–Z. FT ("made–att") sorts by made, then attempts; "–" (not tracked) always sorts last.
  const sortKey = (td) => {
    const t = td.textContent.trim();
    const m = t.match(/^(\d+)–(\d+)/);
    if (m) return +m[1] + +m[2] / 1000;
    const n = parseFloat(t);
    return Number.isNaN(n) ? (t === '–' ? null : t.toLowerCase()) : n;
  };
  document.getElementById('out').addEventListener('click', (e) => {
    const th = e.target.closest('thead th');
    if (!th) return;
    const table = th.closest('table');
    const col = th.cellIndex;
    const tbody = table.tBodies[0];
    const rows = [...tbody.rows];
    const keys = new Map(rows.map((r) => [r, sortKey(r.cells[col])]));
    const isText = rows.some((r) => typeof keys.get(r) === 'string');
    const dir = th.getAttribute('aria-sort') === 'descending' ? 'ascending'
      : th.getAttribute('aria-sort') === 'ascending' ? 'descending'
      : isText ? 'ascending' : 'descending';
    const sign = dir === 'ascending' ? 1 : -1;
    rows.sort((a, b) => {
      const x = keys.get(a), y = keys.get(b);
      if (x === y) return 0;
      if (x == null) return 1;
      if (y == null) return -1;
      return (x < y ? -1 : 1) * sign;
    });
    tbody.append(...rows);
    table.querySelectorAll('thead th').forEach((h) => h.removeAttribute('aria-sort'));
    th.setAttribute('aria-sort', dir);
  });

  const tabs = document.querySelectorAll('.tabs button');
  tabs.forEach((b) =>
    b.addEventListener('click', () => {
      tabs.forEach((x) => x.setAttribute('aria-selected', String(x === b)));
      render(b.dataset.team);
    })
  );
  render('V');
</script>
</body>
</html>
